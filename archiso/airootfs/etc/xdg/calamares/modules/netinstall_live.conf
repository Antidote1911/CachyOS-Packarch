#
# Online installation of the XFCE live ISO (CachyOS-Live-ISO): the CachyOS
# base groups of netinstall.yaml, the applications of the live ISO, the
# desktop chosen in packagechooser@desktop (hidden groups "XFCE" and
# "Openbox", selected by name) and optional software (one checkbox each,
# sorted in categories). The settings of the live ISO common to both
# desktops are copied afterwards by shellprocess@live_config. Themes, icons,
# wallpapers and the desktop settings (packarch-xfce-settings or
# packarch-openbox, and their dependencies) come from the Packarch
# repository.
---
groupsUrl: local
required: true
label:
    sidebar: "Packages"
    sidebar[fr]: "Paquets"
    title: "Additional packages"
    title[fr]: "Logiciels supplémentaires"

groups:
- name: "CachyOS required (hidden)"
  description: "needed CachyOS packages"
  hidden: true
  selected: true
  critical: true
  packages:
    - cachyos-hooks
    - cachyos-keyring
    - cachyos-mirrorlist
    - cachyos-v3-mirrorlist
    - cachyos-v4-mirrorlist
    - cachyos-rate-mirrors
    - chwd
- name: "CachyOS kernels (hidden)"
  description: "CachyOS kernels to install"
  hidden: true
  selected: true
  critical: true
  packages:
    - linux-cachyos
    - linux-cachyos-headers
    - amd-ucode
    - intel-ucode
- name: "CachyOS Packages (hidden)"
  description: "CachyOS tools"
  hidden: true
  selected: true
  critical: true
  packages:
    - cachyos-hello
    - cachyos-kernel-manager
    - cachyos-packageinstaller
    - cachyos-settings
    - cachyos-wallpapers
    # cachyos-zsh-config without vim (Packarch repository)
    - packarch-zsh-config
- name: "Base system (hidden)"
  description: "Network, firewall, bluetooth, audio, fonts, hardware and common tools"
  hidden: true
  selected: true
  critical: true
  packages:
    # Network
    - dnsmasq
    - dnsutils
    - ethtool
    - iwd
    - modemmanager
    - networkmanager
    - networkmanager-openvpn
    - nss-mdns
    - usb_modeswitch
    - wpa_supplicant
    - wireless-regdb
    - xl2tpd
    # Firewall
    - ufw
    - ufw-extras
    # Bluetooth
    - bluez
    - bluez-hid2hci
    - bluez-libs
    - bluez-utils
    - bluez-obex
    # Package management
    - pacman-contrib
    - pkgfile
    - rebuild-detector
    - reflector
    - shelly
    - yay
    - paru
    # Desktop integration
    - accountsservice
    - bash-completion
    - ffmpegthumbnailer
    - gst-libav
    - gst-plugin-pipewire
    - gst-plugins-bad
    - gst-plugins-ugly
    - libdvdcss
    - libgsf
    - libopenraw
    - plocate
    - poppler-glib
    - xdg-user-dirs
    - xdg-utils
    # Filesystems
    - efitools
    - nfs-utils
    - nilfs-utils
    - ntfs-3g
    - smartmontools
    - unrar
    - unzip
    # Fonts
    - awesome-terminal-fonts
    - noto-fonts-emoji
    - cantarell-fonts
    - noto-fonts
    - noto-fonts-cjk
    - ttf-bitstream-vera
    - ttf-dejavu
    - ttf-liberation
    - ttf-opensans
    - ttf-meslo-nerd
    - ttf-jetbrains-mono-nerd
    # Audio
    - alsa-firmware
    - alsa-plugins
    - alsa-utils
    - pipewire-pulse
    - wireplumber
    - pipewire-alsa
    - realtime-privileges
    # Hardware
    - dmidecode
    - dmraid
    - hdparm
    - hwdetect
    - hwinfo
    - inxi
    - linux-firmware
    - lsscsi
    - mesa-utils
    - mtools
    - sg3_utils
    - sof-firmware
    # Power
    - cpupower
    - power-profiles-daemon
    - upower
    # Tools (no alacritty/micro/vim/ranger: only nano and geany as editors)
    - btop
    - duf
    - fsarchiver
    - git
    - glances
    - fastfetch
    - nano
    - nano-syntax-highlighting
    - pv
    - python-defusedxml
    - python-packaging
    - rsync
    - wget
    - ripgrep
    - openssh
- name: "Desktop applications (hidden)"
  description: "The display manager, the applications and the themes of the live ISO, for both desktops"
  hidden: true
  selected: true
  critical: true
  packages:
    - lightdm
    - lightdm-gtk-greeter
    - lightdm-gtk-greeter-settings
    # Packarch repository: LightDM greeter and numeric keypad, no screen
    # blanking, pacman hooks (Geany, entries hidden from the menus)
    - packarch-system-settings
    # Packarch repository: the GTK themes, icon themes and wallpapers of the
    # XFCE theme switcher and of the LightDM greeter (packarch-openbox pulls
    # the -openbox packages of the Openbox themes)
    - packarch-backgrounds
    - packarch-icons
    - packarch-themes
    # Qogir icons and Qogir-Dark cursor (desktop and greeter; also a
    # dependency of packarch-icons)
    - qogir-icon-theme
    - xorg-server
    - xorg-xrandr
    - xf86-input-libinput
    - xdg-user-dirs-gtk
    - network-manager-applet
    - blueman
    - pavucontrol
    - polkit-gnome
    - gvfs
    - gvfs-mtp
    - gvfs-smb
    - file-roller
    - xarchiver
    - catfish
    - meld
    - geany
    - smplayer
    - smplayer-skins
    - smplayer-themes
    - cachyos-grub-theme
    # Papirus-Dark, inherited by the icon themes
    - papirus-icon-theme
    # Packarch repository: applications of the author
    - cryptyrust
    # Password dialog of github-setup (first login)
    - zenity
    - liloucalc
    - nounours-player
    - packarch-rmatrix
    - firefox
    - firefox-i18n-$LOCALE
# The two desktops of packagechooser@desktop: the name of the group is the id
# of the item (packagechooser_desktop.conf), only the chosen one is selected
- name: "XFCE"
  description: "The XFCE desktop of the live ISO"
  hidden: true
  selected: false
  critical: true
  packages:
    # Packarch repository: settings in /etc/skel and theme switcher
    - packarch-xfce-settings
    - xfce4
    - xfce4-battery-plugin
    - xfce4-clipman-plugin
    - xfce4-cpufreq-plugin
    - xfce4-cpugraph-plugin
    - xfce4-dict
    - xfce4-diskperf-plugin
    - xfce4-eyes-plugin
    - xfce4-fsguard-plugin
    - xfce4-genmon-plugin
    - xfce4-mailwatch-plugin
    - xfce4-mount-plugin
    - xfce4-netload-plugin
    - xfce4-notes-plugin
    - xfce4-notifyd
    - xfce4-places-plugin
    - xfce4-pulseaudio-plugin
    - xfce4-screensaver
    - xfce4-screenshooter
    - xfce4-smartbookmark-plugin
    - xfce4-systemload-plugin
    - xfce4-taskmanager
    - xfce4-time-out-plugin
    - xfce4-timer-plugin
    - xfce4-verve-plugin
    - xfce4-wavelan-plugin
    - xfce4-weather-plugin
    - xfce4-whiskermenu-plugin
    - xfce4-xkb-plugin
    - thunar-archive-plugin
    - thunar-media-tags-plugin
    - ristretto
- name: "Openbox"
  description: "The Openbox desktop of Packarch (packarch-openbox)"
  hidden: true
  selected: false
  critical: true
  packages:
    # Packarch repository, like its dependencies (themes, skin chooser,
    # cursors, fonts, AUR packages)
    - packarch-openbox
    - thunar-archive-plugin
    - thunar-media-tags-plugin
    - thunar-volman
    - tumbler
- name: "Internet"
