#
# Desktop of the online installation (CachyOS-Live-ISO): the XFCE desktop of
# the live ISO or the Openbox desktop of Packarch (packarch-openbox). The id
# of the chosen item is the name of the netinstall group to select
# (netinstall_live.conf: hidden groups "XFCE" and "Openbox"); the settings of
# that desktop are copied by shellprocess@live_config (apply-live-config).
---
mode: required
method: netinstall-select
labels:
    step: "Desktop"
    step[fr]: "Bureau"
default: XFCE
items:
    - id: XFCE
      name: "XFCE"
      description: "The desktop of the live ISO: XFCE with its theme switcher, its panel and its settings."
      description[fr]: "Le bureau du live : XFCE avec son sélecteur de thèmes, son panneau et ses réglages."
      screenshot: "/etc/calamares/images/xfce.jxl"
    - id: Openbox
      name: "Openbox"
      description: "The Openbox desktop of Packarch: polybar, rofi menus, dunst notifications, kitty terminal and 10 themes, switched from the desktop menu."
      description[fr]: "Le bureau Openbox de Packarch : polybar, menus rofi, notifications dunst, terminal kitty et 10 thèmes, à changer depuis le menu du bureau."
      screenshot: "/etc/calamares/images/openbox.jxl"
