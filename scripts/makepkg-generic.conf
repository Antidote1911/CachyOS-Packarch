#!/hint/bash
#
# makepkg configuration of the packages of the ISO (Calamares, AUR packages of
# packages/aur.list): the one of the system, with generic x86-64 code. The
# system one may use -march=native (CachyOS), and these packages run on the
# live ISO or on the installed system, on any processor.
# Used by calamares/build.sh and packages/build.sh (makepkg --config).

source /etc/makepkg.conf

CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
RUSTFLAGS="-C opt-level=2"
